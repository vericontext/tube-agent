[project]
name = "tube-agent"
version = "0.2.0"
description = "YouTube channel analysis agentic AI system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "yt-dlp>=2025.1",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Database
    "sqlalchemy>=2.0",
    # Validation & config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",  # for TestClient
]

[tool.setuptools.packages.find]
include = ["scripts*", "tube_agent*"]

[project.scripts]
fetch-all = "scripts.fetch_all:main"
tube-api = "tube_agent.cli:run_api"
tube-migrate = "tube_agent.migrations.migrate_json:main"
