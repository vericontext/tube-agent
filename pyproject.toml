[project]
name = "tube-agent"
version = "0.2.0"
description = "YouTube channel analysis agentic AI system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # Validation & config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Auth
    "PyJWT[crypto]>=2.8",
    # Task queue
    "celery[redis]>=5.4",
    "redis>=5.0",
    # R2 / S3 storage
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",  # for TestClient
]

[tool.setuptools.packages.find]
include = ["scripts*", "tube_agent*"]

[project.scripts]
fetch-all = "scripts.fetch_all:main"
tube-api = "tube_agent.cli:run_api"
tube-migrate = "tube_agent.migrations.migrate_json:main"
