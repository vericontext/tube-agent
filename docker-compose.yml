# Local development stack
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tube_agent
      POSTGRES_USER: tube_agent
      POSTGRES_PASSWORD: tube_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tube_agent:tube_agent_dev@db:5432/tube_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: uvicorn tube_agent.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://tube_agent:tube_agent_dev@db:5432/tube_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A tube_agent.tasks.celery_app worker --loglevel=info -Q default,analysis

volumes:
  pgdata:
