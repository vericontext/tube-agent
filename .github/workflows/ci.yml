name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'tube_agent/**'
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/**'
            frontend:
              - 'desktop/src/**'
              - 'desktop/package.json'
              - 'desktop/package-lock.json'
              - 'desktop/index.html'
              - 'desktop/vite.config.*'
              - 'desktop/tsconfig*.json'
              - '.github/workflows/**'
            desktop:
              - 'desktop/**'
              - 'tube_agent/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - '.github/workflows/**'

  python-tests:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Check desktop version metadata
        run: .venv/bin/python scripts/check_desktop_version.py

      - name: Run tests
        run: .venv/bin/pytest tests/ -q

  frontend-build:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build

  macos-package-smoke:
    name: macOS Apple Silicon package smoke
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Python desktop dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[desktop]"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build sidecar
        run: bash desktop/scripts/build-sidecar.sh

      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri build -- --target aarch64-apple-darwin
