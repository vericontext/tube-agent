[package]
name = "tube-agent"
version = "0.0.1"
description = "Tube Agent — local YouTube transcript indexer + semantic search"
authors = ["Kiyeon Jeon"]
edition = "2021"

[lib]
name = "tube_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
